# ============================================================
# CUDA Learning - Docker Compose
# ============================================================
#   docker compose up -d --build          # build and start
#   docker compose exec cuda-dev bash     # get a shell
#   docker compose down                   # stop
#
# Inside the container:
#   verify-cuda            # check the toolchain and the GPU
#   ./scripts/build.sh     # build every exercise
#   ./scripts/run-all.sh   # run the reference solutions
# ============================================================

services:
  cuda-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to 0 to skip the ~500 MB Nsight Systems download.
        INSTALL_NSIGHT_SYSTEMS: "1"
    container_name: cuda-learning-dev
    image: cuda-learning-dev:latest

    # GPU passthrough. Requires the NVIDIA Container Toolkit:
    #   https://docs.nvidia.com/datacenter/cloud-native/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # The whole repository is bind-mounted, including build/, so
    # compile_commands.json and the binaries stay visible to the
    # editor running on the host.
    volumes:
      - .:/workspace

    stdin_open: true
    tty: true

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # `graphics` is needed by the Phase 5 CUDA/OpenGL exercise.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - TZ=Asia/Ho_Chi_Minh

    ports:
      - "8899:8888"   # Jupyter -> http://localhost:8899

    working_dir: /workspace
    restart: unless-stopped

    # Nsight Compute needs access to GPU performance counters.
    # If `ncu` reports ERR_NVGPUCTRPERM, either add
    #   cap_add: [SYS_ADMIN]
    # here, or allow non-root profiling on the host:
    #   https://developer.nvidia.com/nvidia-development-tools-solutions-err-nvgpuctrperm
    cap_add:
      - SYS_ADMIN

    shm_size: '2g'
    ulimits:
      memlock:
        soft: -1
        hard: -1
